# The site build, once, called by every workflow that needs it.
#
# It used to live inside pages.yml, which also deployed - so "build the site"
# and "publish the site to the live domain" were the same event. They are not
# any more (see ci.yml and release.yml): main gets a rolling preview, and
# lotrlcg.app only moves when a release-please release PR is merged. One copy
# of these steps, called from both.
name: Build site
on:
  workflow_call:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        # Only the optional "Build rules text" step below needs Node (for
        # `npm i -g @llamaindex/liteparse`) - nothing else in this workflow
        # touches it. Set up unconditionally rather than gating the setup
        # step on url= being non-empty; it costs a few seconds and keeps the
        # rules-text step self-contained.
        with:
          node-version: "20"
      - name: Build card data
        # Single pass: the sets-to-gather enrichment it merges
        # (tools/data/enrichment.json) is COMMITTED, so there is no fetch
        # step and no second build pass here any more. That enrichment is
        # aggregated metadata (a list of encounter-set names per scenario),
        # which CLAUDE.md's data policy allows in git; only the verbatim
        # card DB this step compiles stays generated-and-gitignored.
        # Regenerating the enrichment is a deliberate, local, occasional
        # act - `python3 tools/build_hob_enrichment.py --refresh` - never
        # something CI does: a cold run costs 40+ minutes against a slow
        # third-party API, which is what used to push this deploy past
        # 9 minutes. Ditto docs/data/tips.json, committed and simply
        # uploaded with the rest of docs/ below.
        run: python3 tools/build_card_data.py
      - name: Pack the quest-picker catalog
        # catalog.bin: the picker's rows as fixed-width struct records plus a
        # deduped string table. Parsing index.json on the device cost 713 ms
        # and 263 KB resident, ~87% of it decode rather than I/O (MicroPython's
        # json is pure Python on that build; struct.unpack is C). Reads no
        # network, needs no deps, and depends only on the index.json the step
        # above just wrote.
        run: python3 tools/build_catalog_pack.py
      - name: Install icon rasterizer deps
        # librsvg2-bin provides the rsvg-convert CLI - build_icons.py's
        # svg_to_mask() fallback backend when the cairosvg package isn't
        # installed (avoids also needing libcairo2's native lib). Pillow is
        # required either way, for the greyscale/threshold step. continue-
        # on-error: an apt/pip hiccup here just means the next step falls
        # through to its own clean SystemExit (icons are optional - see
        # CLAUDE.md's Card data section), not a failed deploy.
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          pip install Pillow
      - name: Build icons
        # Fetches the pinned icon pack tarball (tools/data/icons.SOURCE.txt,
        # see CLAUDE.md's Card data section) - no local --assets pack needed.
        # continue-on-error because icons are optional: a fetch/rasterize
        # hiccup here must not fail the Pages deploy (card data, built
        # above, is the critical artifact). On failure no icons.json is
        # written and every icon_slot() falls back to its placeholder glyph
        # until the next successful build.
        #
        # --svg-out is passed EXPLICITLY: the flag defaults off, because
        # docs/data/ is also what the device deploy copies wholesale
        # (`mpremote cp -r docs/data/ :/data/`) and ~2.0 MB of tablet-only
        # vector art has no reader on the Presto. Only this Pages build,
        # which serves the tablet client, asks for it.
        continue-on-error: true
        run: python3 tools/build_icons.py --svg-out docs/data/icons/svg
      - name: Build rules text
        # docs/data/rules_text.json: Rules Reference excerpts keyed by
        # section id and glossary term, for the tablet client's rules
        # lookup (see rules/README.md's "What ships" and CLAUDE.md's Card
        # data section). continue-on-error, same reasoning as icons above:
        # this is optional context, not the critical artifact. Skips
        # cleanly when tools/data/rules.SOURCE.txt has no url= - there is
        # no verified direct download link for the PDF (plan ruling R3),
        # so most runs take this branch and do nothing. When a url= is
        # filled in: fetch the pinned PDF, verify it against the pinned
        # sha256, parse it to markdown with liteparse (needs Node - not
        # otherwise used by this workflow, hence the actions/setup-node step
        # at the top of this job), then run the two build steps a local
        # rebuild would run.
        continue-on-error: true
        run: |
          url=$(grep '^url=' tools/data/rules.SOURCE.txt | cut -d= -f2-)
          if [ -z "$url" ]; then
            echo "no pinned rules URL - skipping rules_text.json"
          else
            curl -fsSL -o /tmp/rr.pdf "$url"
            pin=$(grep '^sha256=' tools/data/rules.SOURCE.txt | cut -d= -f2-)
            got=$(sha256sum /tmp/rr.pdf | cut -d' ' -f1)
            if [ "$pin" != "$got" ]; then
              echo "sha256 mismatch: pinned $pin, got $got" >&2
              exit 1
            fi
            npm i -g @llamaindex/liteparse
            python3 tools/build_rules_corpus.py /tmp/rr.pdf --title "Rules Reference" --no-ocr
            python3 tools/build_rules_text.py
          fi
      - uses: actions/upload-artifact@v4
        # The built docs/ for whichever caller asked for it: the GitHub Pages
        # preview deploy, the Cloudflare production deploy, or neither (a PR
        # build, which just proves the site still builds).
        with:
          name: site
          path: docs
          retention-days: 7
          include-hidden-files: true
